<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>32×32 ドット絵たまご</title>
<style>
  body { background: #07080f; color: #fff; font-family: sans-serif; padding: 40px; }
  h1 { color: #a78bfa; margin-bottom: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 32px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .card h2 { font-size: 13px; color: #94a3b8; margin: 0; text-align: center; }
  .sizes { display: flex; gap: 16px; align-items: flex-end; }
  .label { font-size: 11px; color: #64748b; text-align: center; margin-top: 4px; }
  canvas { image-rendering: pixelated; display: block; }
  .bg-frame { background: #0f172a; border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
<h1>32×32 ドット絵たまご — 5カラー</h1>
<p style="color:#64748b">左: 6倍表示（192px）　右: 実寸（32px）</p>

<div class="grid" id="gallery"></div>

<div style="margin-top: 56px">
  <h2 style="color:#475569; font-size:14px; margin-bottom: 12px">グリッドマップ（8倍・シアン）</h2>
  <canvas id="grid-canvas" style="border:1px solid #1e293b; border-radius:4px;"></canvas>
  <p style="font-size:11px; color:#475569; margin-top:6px">各マスが1ドット = 実際は右の32px</p>
</div>

<script>
// 32×32 egg pixel map: each entry is [startCol, endCol] inclusive, or null
const eggRows = [
  null, null,       // 0-1
  [15, 16],         // 2  (2px)
  [13, 18],         // 3  (6px)
  [11, 20],         // 4  (10px)
  [10, 21],         // 5  (12px)
  [9, 22],          // 6  (14px)
  [8, 23],          // 7  (16px)
  [8, 23],          // 8  (16px)
  [7, 24],          // 9  (18px)
  [7, 24],          // 10 (18px)
  [6, 25],          // 11 (20px)
  [6, 25],          // 12 (20px)
  [6, 25],          // 13 (20px)
  [6, 25],          // 14 (20px) ← widest
  [7, 24],          // 15 (18px)
  [7, 24],          // 16 (18px)
  [8, 23],          // 17 (16px)
  [9, 22],          // 18 (14px)
  [10, 21],         // 19 (12px)
  [11, 20],         // 20 (10px)
  [12, 19],         // 21 (8px)
  [14, 17],         // 22 (4px)
  null, null, null, null, null, null, null, null, null  // 23-31
];

function getPixelType(row, col) {
  const r = eggRows[row];
  if (!r) return 'bg';
  const [s, e] = r;
  if (col < s || col > e) return 'bg';
  if (col === s || col === e) return 'border';

  const span = e - s;        // total width including borders
  const inner = col - s;     // 1 … span-1

  // highlight: upper portion, left side
  const hlW = Math.max(1, Math.floor((span - 1) * 0.30));
  if (row <= 8 && inner <= hlW) return 'highlight';

  // shadow: lower portion, right side
  const shStart = span - 1 - Math.max(1, Math.floor((span - 1) * 0.30));
  if (row >= 12 && inner >= shStart) return 'shadow';

  return 'fill';
}

const palettes = [
  {
    name: 'クリーム卵',
    colors: { bg: '#07080f', border: '#7c2d12', fill: '#fef3c7', highlight: '#ffffff', shadow: '#d97706' }
  },
  {
    name: 'クリスタル',
    colors: { bg: '#07080f', border: '#1e40af', fill: '#93c5fd', highlight: '#eff6ff', shadow: '#1d4ed8' }
  },
  {
    name: 'やみ',
    colors: { bg: '#07080f', border: '#2e1065', fill: '#4c1d95', highlight: '#a78bfa', shadow: '#1e0035' }
  },
  {
    name: 'ゴールド',
    colors: { bg: '#07080f', border: '#78350f', fill: '#fcd34d', highlight: '#fefce8', shadow: '#b45309' }
  },
  {
    name: 'モノクロ',
    colors: { bg: '#07080f', border: '#374151', fill: '#9ca3af', highlight: '#f9fafb', shadow: '#4b5563' }
  },
];

function drawEgg(ctx, palette, scale) {
  ctx.fillStyle = palette.colors.bg;
  ctx.fillRect(0, 0, 32 * scale, 32 * scale);
  for (let row = 0; row < 32; row++) {
    for (let col = 0; col < 32; col++) {
      const type = getPixelType(row, col);
      if (type === 'bg') continue;
      ctx.fillStyle = palette.colors[type];
      ctx.fillRect(col * scale, row * scale, scale, scale);
    }
  }
}

const gallery = document.getElementById('gallery');

palettes.forEach(palette => {
  const card = document.createElement('div');
  card.className = 'card';

  const h2 = document.createElement('h2');
  h2.textContent = palette.name;
  card.appendChild(h2);

  const sizes = document.createElement('div');
  sizes.className = 'sizes';

  // 6× preview
  const wrap6 = document.createElement('div');
  wrap6.className = 'bg-frame';
  const c6 = document.createElement('canvas');
  c6.width = 32 * 6;
  c6.height = 32 * 6;
  c6.style.cssText = 'image-rendering:pixelated;width:192px;height:192px';
  drawEgg(c6.getContext('2d'), palette, 6);
  const l6 = document.createElement('div');
  l6.className = 'label';
  l6.textContent = '192px (×6)';
  wrap6.appendChild(c6);
  wrap6.appendChild(l6);
  sizes.appendChild(wrap6);

  // 1× actual size
  const wrap1 = document.createElement('div');
  wrap1.className = 'bg-frame';
  const c1 = document.createElement('canvas');
  c1.width = 32;
  c1.height = 32;
  c1.style.cssText = 'image-rendering:pixelated;width:32px;height:32px';
  drawEgg(c1.getContext('2d'), palette, 1);
  const l1 = document.createElement('div');
  l1.className = 'label';
  l1.textContent = '32px (実寸)';
  wrap1.appendChild(c1);
  wrap1.appendChild(l1);
  sizes.appendChild(wrap1);

  card.appendChild(sizes);
  gallery.appendChild(card);
});

// Grid preview
const gc = document.getElementById('grid-canvas');
gc.width = 32 * 8;
gc.height = 32 * 8;
gc.style.cssText = `image-rendering:pixelated;width:${32*8}px;height:${32*8}px`;
const gctx = gc.getContext('2d');
drawEgg(gctx, palettes[1], 8); // crystal color

// grid lines
gctx.strokeStyle = 'rgba(15,23,42,0.8)';
gctx.lineWidth = 0.5;
for (let i = 0; i <= 32; i++) {
  gctx.beginPath(); gctx.moveTo(i * 8, 0); gctx.lineTo(i * 8, 256); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(0, i * 8); gctx.lineTo(256, i * 8); gctx.stroke();
}
</script>

<hr style="border-color:#1e293b; margin: 48px 0 24px">
<p style="color:#475569; font-size:13px">
  気に入ったカラーを教えてください。形の調整（幅・高さ・ハイライトの広さ等）も可能です。<br>
  決定したらPNGファイルとしてエクスポートしファビコン・PWAアイコンに適用します。
</p>
</body>
</html>
