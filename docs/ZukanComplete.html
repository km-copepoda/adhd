<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>モンスター図鑑 — フルコンプリート</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d14;
    color: #e2d5b0;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 375px;
    min-height: 100vh;
    padding: 0 14px 100px;
  }

  /* ── ヘッダー */
  .header {
    padding: 22px 0 4px;
    text-align: center;
  }
  .header h1 { font-size: 19px; letter-spacing: 0.15em; color: #fbbf24; text-shadow: 0 0 16px rgba(251,191,36,.5); }
  .header .count { font-size: 11px; color: #9a8c6e; margin-top: 3px; }

  /* ── コンプリートバナー */
  .banner {
    margin: 12px 0 16px;
    border: 1px solid rgba(251,191,36,.4);
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(251,191,36,.09), rgba(139,92,246,.09));
    padding: 10px;
    text-align: center;
  }
  .banner .stars { font-size: 18px; letter-spacing: 5px; }
  .banner .ttl { font-size: 14px; font-weight: bold; color: #fbbf24; letter-spacing: .08em; margin-top: 3px; }
  .banner .sub { font-size: 10px; color: #9a8c6e; margin-top: 2px; }

  /* ── サイドタブ */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 7px 4px; border-radius: 8px;
    border: 1px solid #2e2a42; background: #12111c;
    color: #6b5f45; font-size: 11px; text-align: center; cursor: pointer;
    transition: all .15s;
  }
  .tab.on { border-color: rgba(251,191,36,.5); color: #fbbf24; background: rgba(251,191,36,.07); }

  /* ── 卵 */
  .egg-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
  .egg-card {
    background: #1a1829; border: 1px solid #2e2a42; border-radius: 12px;
    padding: 10px 18px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .egg-card img { width: 56px; height: 56px; object-fit: contain; }
  .egg-card .lbl { font-size: 11px; color: #c9bfa0; }
  .egg-arrow { font-size: 11px; color: rgba(107,95,69,.6); margin: 4px 0 0; }

  /* ── 系統セクション */
  .branch { margin-bottom: 20px; border-radius: 14px; overflow: hidden; }

  .branch-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    font-size: 12px; font-weight: bold; letter-spacing: .08em;
  }
  .branch-hdr .prog { font-size: 10px; opacity: .7; font-weight: normal; }

  .branch.study  .branch-hdr { background: rgba(96,165,250,.12); color: #93c5fd; border-bottom: 1px solid rgba(96,165,250,.2); }
  .branch.stamina .branch-hdr { background: rgba(248,113,113,.12); color: #fca5a5; border-bottom: 1px solid rgba(248,113,113,.2); }
  .branch.life   .branch-hdr { background: rgba(74,222,128,.12); color: #86efac; border-bottom: 1px solid rgba(74,222,128,.2); }

  /* ── Stage1 フィーチャーカード */
  .s1-feature {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px 10px;
    background: #1a1829;
    border-bottom: 1px solid #1e1c2e;
  }
  .s1-feature img { width: 72px; height: 72px; object-fit: contain; flex-shrink: 0; }
  .s1-feature .info { flex: 1; }
  .s1-feature .s1-name { font-size: 15px; font-weight: bold; color: #e2d5b0; }
  .s1-feature .s1-path { margin-top: 4px; }
  .s1-feature .s1-path .path-chips { justify-content: flex-start; }
  .s1-feature .s1-path .chip { font-size: 15px; width: 28px; height: 28px; border-radius: 8px; }

  /* ── Stage2 + Stage3 行 */
  .s2s3-rows { background: #14131f; }

  .s2s3-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(30,28,46,.8);
  }
  .s2s3-row:last-child { border-bottom: none; }

  /* ── 進化パスチップ（色付きバッジ） */
  .path-chips {
    display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: center;
  }
  .chip {
    font-size: 13px; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px; flex-shrink: 0;
  }
  .chip.study   { background: rgba(96,165,250,.22); box-shadow: 0 0 0 1px rgba(96,165,250,.3); }
  .chip.stamina { background: rgba(248,113,113,.22); box-shadow: 0 0 0 1px rgba(248,113,113,.3); }
  .chip.life    { background: rgba(74,222,128,.22);  box-shadow: 0 0 0 1px rgba(74,222,128,.3); }
  .chip-arrow   { font-size: 9px; color: rgba(107,95,69,.45); }

  /* S3用：チップを一回り小さく */
  .path-chips.sm .chip   { font-size: 10px; width: 18px; height: 18px; border-radius: 5px; }
  .path-chips.sm .chip-arrow { font-size: 7px; }

  /* S2カード */
  .s2-card {
    flex-shrink: 0; width: 76px;
    background: #1a1829; border: 1px solid #2e2a42; border-radius: 10px;
    padding: 6px 4px 5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .s2-card img { width: 50px; height: 50px; object-fit: contain; }
  .s2-card .name { font-size: 9px; color: #c9bfa0; text-align: center; line-height: 1.3; }

  /* 矢印 */
  .s2s3-arrow { color: rgba(107,95,69,.5); font-size: 12px; margin-top: 26px; flex-shrink: 0; }

  /* S3グリッド（3枚） */
  .s3-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

  .s3-card {
    background: linear-gradient(160deg, #1e1a2e, #1a1829);
    border: 1px solid #3d3450; border-radius: 9px;
    padding: 5px 3px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    position: relative;
  }
  .s3-card img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .s3-card .name { font-size: 8px; color: #c9bfa0; text-align: center; line-height: 1.2; }

  /* ─── 収集済みグロー */
  .collected.s2-card { border-color: rgba(251,191,36,.28); }
  .collected.s3-card { border-color: rgba(139,92,246,.35); }
  .s1-feature.collected { /* always collected in this mock */ }

  /* ── ボトムナビ */
  .bottom-nav {
    position: fixed; bottom: 0; width: 375px;
    background: #12111c; border-top: 1px solid #2e2a42;
    display: flex; justify-content: space-around; padding: 8px 0 14px;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: #6b5f45; }
  .nav-item.on { color: #fbbf24; }
  .nav-item .icon { font-size: 22px; }
</style>

// 色付きチップHTML（size: "" | "sm"）
function chips(path, size=""){
  const parts = path.split("_");
  const cls = size ? `path-chips ${size}` : "path-chips";
  const inner = parts.map((s,i)=>{
    const cat = s.toLowerCase();
    return (i>0?`<span class="chip-arrow">›</span>`:"") +
           `<span class="chip ${cat}">${EMOJI[s]||"?"}</span>`;
  }).join("");
  return `<div class="${cls}">${inner}</div>`;
}

  if(!parent) return keys.filter(k=>k.split("_").length===1);
  const d=parent.split("_").length;
  return keys.filter(k=>k.startsWith(parent+"_")&&k.split("_").length===d+1);
}

function render(){
  const d=DATA[side];
  document.getElementById("egg-img").src=d.egg;
  document.getElementById("total-label").textContent="39 / 39 体";

  let html="";
  for(const s1 of STAGE1){
    const m1=d.monsters[s1];
    const s2keys=ch(s1);
    html+=`
    <div class="branch ${BRANCHCSS[s1]}">
      <div class="branch-hdr">
        <span>${EMOJI[s1]} ${CATNAME[s1]}系 — Stage 1</span>
        <span class="prog">13 / 13 体</span>
      </div>
      <div class="s1-feature collected">
        <img src="${m1.img}" alt="${m1.name}" onerror="this.style.opacity='.15'">
        <div class="info">
          <div class="s1-name">${m1.name}</div>
          <div class="s1-path">${chips(s1)}</div>
        </div>
      </div>
      <div class="s2s3-rows">`;

    for(const s2 of s2keys){
      const m2=d.monsters[s2];
      const s3keys=ch(s2);
      html+=`
        <div class="s2s3-row">
          <div class="s2-card collected">
            ${chips(s2)}
            <img src="${m2.img}" alt="${m2.name}" onerror="this.style.opacity='.15'">
            <div class="name">${m2.name}</div>
          </div>
          <div class="s2s3-arrow">›</div>
          <div class="s3-grid">`;

      for(const s3 of s3keys){
        const m3=d.monsters[s3];
        html+=`
            <div class="s3-card collected">
              ${chips(s3,"sm")}
              <img src="${m3.img}" alt="${m3.name}" onerror="this.style.opacity='.15'">
              <div class="name">${m3.name}</div>
            </div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div></div>`;
  }
  document.getElementById("tree").innerHTML=html;
}

function setSide(s,el){
  side=s;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  el.classList.add("on");
  render();
}

render();
</script>
</body>
</html>
