<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>モンスター図鑑 — ツリーUI フルコンプリート</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d14;
    color: #e2d5b0;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .phone {
    width: 375px;
    min-height: 100vh;
    background: #0d0d14;
    padding: 0 16px 100px;
    position: relative;
  }

  /* ── ヘッダー */
  .header {
    padding: 24px 0 6px;
    text-align: center;
  }
  .header h1 {
    font-size: 20px;
    letter-spacing: 0.15em;
    color: #fbbf24;
    text-shadow: 0 0 16px rgba(251,191,36,0.5);
    margin-bottom: 4px;
  }
  .header .count {
    font-size: 12px;
    color: #9a8c6e;
    margin-bottom: 16px;
  }

  /* ── 全コンプリートバナー */
  .complete-banner {
    margin: 0 0 20px;
    border: 1px solid rgba(251,191,36,0.5);
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(251,191,36,0.10), rgba(139,92,246,0.10));
    padding: 12px 16px;
    text-align: center;
  }
  .complete-banner .stars { font-size: 20px; letter-spacing: 6px; margin-bottom: 4px; }
  .complete-banner .title { font-size: 14px; color: #fbbf24; font-weight: bold; letter-spacing: 0.1em; text-shadow: 0 0 12px rgba(251,191,36,0.7); }
  .complete-banner .sub { font-size: 11px; color: #9a8c6e; margin-top: 2px; }

  /* ── 卵（ルートノード） */
  .egg-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 0;
  }
  .egg-card {
    background: #1a1829;
    border: 1px solid #2e2a42;
    border-radius: 12px;
    padding: 12px 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100px;
  }
  .egg-card img { width: 64px; height: 64px; object-fit: contain; }
  .egg-card .egg-label { font-size: 12px; color: #c9bfa0; }

  /* ── コネクタ線 */
  .connector-v {
    width: 1px;
    height: 20px;
    background: rgba(46,42,66,0.8);
  }
  .connector-v.gold { background: rgba(251,191,36,0.35); }
  .connector-h {
    display: flex;
    width: 100%;
    align-items: center;
    margin-bottom: 0;
  }
  .connector-h .line {
    flex: 1;
    height: 1px;
    background: rgba(46,42,66,0.6);
  }

  /* ── Stage 1 行 */
  .stage1-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 0;
  }

  /* ── モンスターカード */
  .card {
    background: #1a1829;
    border: 1px solid #2e2a42;
    border-radius: 12px;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .card:hover { border-color: rgba(251,191,36,0.3); }
  .card.open {
    border-color: #fbbf24;
    box-shadow: 0 0 0 1px rgba(251,191,36,0.25), 0 0 12px rgba(251,191,36,0.12);
  }
  .card.final {
    background: linear-gradient(160deg, #1e1a2e, #1a1829);
    border-color: #3d3450;
    cursor: default;
  }
  .card .path-emojis {
    font-size: 9px;
    color: #6b5f45;
    letter-spacing: 1px;
    min-height: 13px;
  }
  .card img { width: 56px; height: 56px; object-fit: contain; }
  .card .name { font-size: 10px; text-align: center; color: #c9bfa0; line-height: 1.3; }
  .card .open-indicator {
    font-size: 8px;
    color: #fbbf24;
    margin-top: 1px;
  }

  /* ── Stage 2 展開パネル */
  .stage2-panel {
    display: none;
    margin-top: 2px;
    border-left: 2px solid rgba(251,191,36,0.25);
    padding-left: 10px;
    margin-left: 2px;
  }
  .stage2-panel.open { display: block; }
  .stage2-label {
    font-size: 10px;
    color: #6b5f45;
    letter-spacing: 0.12em;
    margin: 8px 0 8px 2px;
  }
  .stage2-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  /* ── Stage 3 展開パネル */
  .stage3-panel {
    display: none;
    margin-top: 2px;
    margin-left: 8px;
    border-left: 2px solid rgba(251,191,36,0.15);
    padding-left: 10px;
  }
  .stage3-panel.open { display: block; }
  .stage3-label {
    font-size: 10px;
    color: #6b5f45;
    letter-spacing: 0.12em;
    margin: 6px 0 8px 2px;
  }
  .stage3-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  /* ── ヒント */
  .hint {
    text-align: center;
    font-size: 10px;
    color: rgba(107,95,69,0.5);
    margin-top: 32px;
  }

  /* ── サイド切替タブ */
  .side-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .side-tab {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid #2e2a42;
    background: #12111c;
    color: #6b5f45;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .side-tab.active {
    border-color: rgba(251,191,36,0.5);
    color: #fbbf24;
    background: rgba(251,191,36,0.07);
  }

  /* ── ボトムナビ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: 375px;
    background: #12111c;
    border-top: 1px solid #2e2a42;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 14px;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; font-size: 9px; color: #6b5f45;
  }
  .nav-item.active { color: #fbbf24; }
  .nav-item .icon { font-size: 22px; }
</style>

const EMOJI = { STUDY: "📚", STAMINA: "💪", LIFE: "🌿" };
const CAT_NAME = { STUDY: "学力", STAMINA: "体力", LIFE: "生活力" };
const STAGE1 = ["STUDY", "STAMINA", "LIFE"];

// ── 状態 ─────────────────────────────────────────────
let currentSide = "DARK";
let openS1 = null;    // 展開中のStage1パス
let openS2 = null;    // 展開中のStage2パス

// ── パスエモジ変換 ────────────────────────────────────
function pathEmojis(path) {
  return path.split("_").map(s => EMOJI[s] || "❓").join("›");
}

// ── 子パスを取得 ─────────────────────────────────────
function children(parentPath) {
  const table = currentSide === "LIGHT" ? LIGHT : DARK;
  const allKeys = Object.keys(table);
  if (parentPath === "") return allKeys.filter(k => k.split("_").length === 1);
  const depth = parentPath.split("_").length;
  return allKeys.filter(k => k.startsWith(parentPath + "_") && k.split("_").length === depth + 1);
}

// ── カードHTML ───────────────────────────────────────
function cardHtml(path, { extraClass = "", onclick = "", showArrow = false } = {}) {
  const table = currentSide === "LIGHT" ? LIGHT : DARK;
  const m = table[path];
  const emojis = pathEmojis(path);
  const isOpen = (path === openS1 || path === openS2);
  const openClass = isOpen ? " open" : "";
  const arrow = (showArrow && isOpen) ? `<div class="open-indicator">▾</div>` : (showArrow ? `<div class="open-indicator" style="opacity:0.3">▸</div>` : "");
  return `
    <div class="card${extraClass}${openClass}" onclick="${onclick}">
      <div class="path-emojis">${emojis}</div>
      <img src="${m.img}" alt="${m.name}" onerror="this.style.opacity='0.2';this.src=''">
      <div class="name">${m.name}</div>
      ${arrow}
    </div>`;
}

// ── ツリー描画 ───────────────────────────────────────
function render() {
  const table = currentSide === "LIGHT" ? LIGHT : DARK;
  const eggSrc = currentSide === "LIGHT"
    ? "../public/monsters/light/egg.webp"
    : "../public/monsters/egg.webp";

  let html = `
  <div class="egg-node">
    <div class="egg-card">
      <img src="${eggSrc}" alt="たまご" onerror="this.style.opacity='0.2'">
      <div class="egg-label">🥚 たまご</div>
    </div>
    <div class="connector-v"></div>
    <div class="connector-h"><div class="line"></div><div class="line"></div></div>
  </div>

  <div class="stage1-row">`;

  for (const s1 of STAGE1) {
    html += cardHtml(s1, {
      onclick: `toggleS1('${s1}')`,
      showArrow: true,
    });
  }

  html += `</div>`;

  // Stage 2 パネル
  if (openS1) {
    const s2keys = children(openS1);
    html += `
    <div class="stage2-panel open">
      <div class="stage2-label">▸ Stage 2 — ${CAT_NAME[openS1] || openS1} 系</div>
      <div class="stage2-grid">`;
    for (const s2 of s2keys) {
      html += cardHtml(s2, {
        onclick: `toggleS2('${s2}')`,
        showArrow: true,
      });
    }
    html += `</div>`;

    // Stage 3 パネル
    if (openS2) {
      const s3keys = children(openS2);
      html += `
      <div class="stage3-panel open">
        <div class="stage3-label">▸ Stage 3 — 最終形態</div>
        <div class="stage3-grid">`;
      for (const s3 of s3keys) {
        html += cardHtml(s3, { extraClass: " final" });
      }
      html += `</div></div>`;
    }

    html += `</div>`;
  }

  document.getElementById("tree-root").innerHTML = html;
}

// ── イベント ─────────────────────────────────────────
function toggleS1(path) {
  if (openS1 === path) { openS1 = null; openS2 = null; }
  else { openS1 = path; openS2 = null; }
  render();
}
function toggleS2(path) {
  openS2 = openS2 === path ? null : path;
  render();
}
function setSide(side, el) {
  currentSide = side;
  openS1 = null; openS2 = null;
  document.querySelectorAll(".side-tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  render();
}

// ── 初期描画 ─────────────────────────────────────────
render();
</script>
</body>
</html>
