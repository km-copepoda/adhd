<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>育成画面モック — Stage 1 / 2 / 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #08080f;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    color: #e2d5b0;
    padding: 20px 10px 40px;
  }
  h1 {
    text-align: center;
    color: #fbbf24;
    font-size: 16px;
    letter-spacing: 0.15em;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  /* ── 3カラム ─────────────────────────── */
  .stage-wrap {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .stage-col {
    flex: 0 0 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .stage-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stage-label {
    font-size: 12px;
    color: #9a8c6e;
    letter-spacing: 0.15em;
  }
  .reroll-btn {
    background: #2e2a42;
    border: 1px solid #3d3450;
    color: #c9bfa0;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .reroll-btn:hover { background: #3d3450; }

  /* ── Phone frame ─────────────────────── */
  .phone {
    width: 340px;
    background: #0d0d14;
    border: 1px solid #2e2a42;
    border-radius: 20px;
    overflow: hidden;
    padding: 20px 14px 72px;
    position: relative;
  }

  /* ── Monster hero ────────────────────── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 20px;
    margin-bottom: 14px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(88,28,135,0.25) 0%, transparent 100%);
  }
  .monster-img-wrap {
    width: 100px;
    height: 100px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 18px rgba(139,92,246,0.35));
    animation: float 3s ease-in-out infinite;
  }
  .monster-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .child-name {
    font-size: 18px;
    color: #fbbf24;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .monster-name {
    font-size: 11px;
    color: #9a8c6e;
    margin-bottom: 14px;
  }
  .path-emojis {
    font-size: 12px;
    color: #9a8c6e;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .xp-label {
    display: flex;
    justify-content: space-between;
    width: 176px;
    font-size: 9px;
    color: #9a8c6e;
    margin-bottom: 4px;
  }
  .xp-bar-wrap {
    width: 176px;
    height: 6px;
    background: #2e2a42;
    border-radius: 9999px;
    overflow: hidden;
    display: flex;
  }
  .xp-bar {
    height: 100%;
    background: linear-gradient(90deg, #b45309, #fbbf24);
    border-radius: 9999px;
  }
  .xp-bar-pending {
    height: 100%;
    background: rgba(251,191,36,0.25);
    border-left: 1px dashed rgba(251,191,36,0.5);
  }
  .final-badge {
    font-size: 11px;
    color: #fbbf24;
    margin-top: 6px;
  }

  /* ── Cards ───────────────────────────── */
  .card {
    background: #1a1829;
    border: 1px solid #2e2a42;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .card.streak { border-left: 3px solid #f97316; }
  .streak-title {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #fbbf24;
  }
  .streak-num {
    font-size: 22px;
    font-weight: bold;
    color: #fb923c;
  }
  .streak-unit { font-size: 11px; color: #9a8c6e; }
  .streak-stats { display: flex; gap: 16px; font-size: 11px; }
  .streak-stats .label { color: #9a8c6e; }
  .streak-stats .val { color: #e2d5b0; font-weight: 500; margin-left: 2px; }
  .streak-next { margin-top: 8px; font-size: 10px; color: #9a8c6e; display: flex; align-items: center; gap: 6px; }

  .total-row { display: flex; justify-content: space-between; align-items: center; }
  .total-label { font-size: 11px; color: #9a8c6e; }
  .total-val { font-size: 18px; font-weight: bold; color: #fbbf24; }

  /* ── Param cards ─────────────────────── */
  .param-card {
    background: #1a1829;
    border: 1px solid #2e2a42;
    border-radius: 12px;
    padding: 12px 14px 12px 18px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }
  .param-stripe {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .param-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .param-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .param-name { font-size: 13px; flex: 1; }
  .param-pts { font-size: 18px; font-weight: bold; }
  .param-pts .unit { font-size: 10px; font-weight: normal; color: #9a8c6e; }
  .param-bar-wrap {
    height: 6px;
    background: #2e2a42;
    border-radius: 9999px;
    overflow: hidden;
    display: flex;
  }
  .param-bar { height: 100%; border-radius: 9999px; }

  /* ── Evolution hint ──────────────────── */
  .evo-hint {
    background: rgba(26,24,41,0.5);
    border: 1px solid #2e2a42;
    border-radius: 12px;
    padding: 12px;
    margin-top: 4px;
  }
  .evo-hint-title { font-size: 10px; color: #9a8c6e; text-align: center; margin-bottom: 8px; }
  .evo-cols { display: flex; gap: 8px; }
  .evo-col { flex: 1; text-align: center; }
  .evo-col .cat { font-size: 11px; }
  .evo-col .pct { font-size: 13px; font-weight: bold; color: #fbbf24; }

  /* ── Rebirth hint (stage3) ───────────── */
  .rebirth-hint {
    margin-top: 4px;
    text-align: center;
    font-size: 10px;
    color: rgba(167,139,250,0.7);
  }

  /* ── Bottom nav ──────────────────────── */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #12111c;
    border-top: 1px solid #2e2a42;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 14px;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: #6b5f45; }
  .nav-item.active { color: #fbbf24; }
  .nav-item .icon { font-size: 20px; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
</style>
</head>
<body>
<h1>🥚 育成画面モック</h1>

<div class="stage-wrap">
  <!-- Stage 1 -->
  <div class="stage-col">
    <div class="stage-header">
      <span class="stage-label">STAGE 1（3体）</span>
      <button class="reroll-btn" onclick="reroll(1)">🔀 ランダム</button>
    </div>
    <div class="phone" id="phone-1"></div>
  </div>

  <!-- Stage 2 -->
  <div class="stage-col">
    <div class="stage-header">
      <span class="stage-label">STAGE 2（9体）</span>
      <button class="reroll-btn" onclick="reroll(2)">🔀 ランダム</button>
    </div>
    <div class="phone" id="phone-2"></div>
  </div>

  <!-- Stage 3 -->
  <div class="stage-col">
    <div class="stage-header">
      <span class="stage-label">STAGE 3（27体・最終形態）</span>
      <button class="reroll-btn" onclick="reroll(3)">🔀 ランダム</button>
    </div>
    <div class="phone" id="phone-3"></div>
  </div>
</div>

<script>
const CAT = {
  STUDY:   { emoji: "📚", name: "学力",   color: "#60a5fa" },
  STAMINA: { emoji: "💪", name: "体力",   color: "#f87171" },
  LIFE:    { emoji: "🌿", name: "生活力", color: "#4ade80" },
};

const MONSTERS = {
  1: [
    { path: "STUDY",   name: "ラーン",   img: "キャラクター/man/勉_ラーン.png" },
    { path: "STAMINA", name: "ストーン", img: "キャラクター/man/体_ストーン.png" },
    { path: "LIFE",    name: "ヘルプ",   img: "キャラクター/man/生_ヘルプ.png" },
  ],
  2: [
    { path: "STUDY_STUDY",     name: "ライブラ",     img: "キャラクター/man/勉勉_ライブラ.png" },
    { path: "STUDY_STAMINA",   name: "アーマード",   img: "キャラクター/man/勉体_アーマード.png" },
    { path: "STUDY_LIFE",      name: "クリン",       img: "キャラクター/man/勉生_クリン.png" },
    { path: "STAMINA_STUDY",   name: "グラビド",     img: "キャラクター/man/体勉_グラビド.png" },
    { path: "STAMINA_STAMINA", name: "ブロック",     img: "キャラクター/man/体体_ブロック.png" },
    { path: "STAMINA_LIFE",    name: "わっしょい",   img: "キャラクター/man/体生_わっしょい.png" },
    { path: "LIFE_STUDY",      name: "チックタック", img: "キャラクター/man/生勉_チックタック.png" },
    { path: "LIFE_STAMINA",    name: "キャリア",     img: "キャラクター/man/生体_キャリア.png" },
    { path: "LIFE_LIFE",       name: "マザー",       img: "キャラクター/man/生生_マザー.png" },
  ],
  3: [
    { path: "STUDY_STUDY_STUDY",       name: "ウィズダム",   img: "キャラクター/man/勉勉勉_ウィズダム.png" },
    { path: "STUDY_STUDY_STAMINA",     name: "タクティクス", img: "キャラクター/man/勉勉体_タクティクス.png" },
    { path: "STUDY_STUDY_LIFE",        name: "エジソン",     img: "キャラクター/man/勉勉生_エジソン.png" },
    { path: "STUDY_STAMINA_STUDY",     name: "フォート",     img: "キャラクター/man/勉体勉_フォート.png" },
    { path: "STUDY_STAMINA_STAMINA",   name: "イージス",     img: "キャラクター/man/勉体体_イージス.png" },
    { path: "STUDY_STAMINA_LIFE",      name: "レスキュー",   img: "キャラクター/man/勉体生_レスキュー.png" },
    { path: "STUDY_LIFE_STUDY",        name: "マイスター",   img: "キャラクター/man/勉生勉_マイスター.png" },
    { path: "STUDY_LIFE_STAMINA",      name: "スリープ",     img: "キャラクター/man/勉生体_スリープ.png" },
    { path: "STUDY_LIFE_LIFE",         name: "セバス",       img: "キャラクター/man/勉生生_セバス.png" },
    { path: "STAMINA_STUDY_STUDY",     name: "クリスタル",   img: "キャラクター/man/体勉勉_クリスタル.png" },
    { path: "STAMINA_STUDY_STAMINA",   name: "マギグラビ",   img: "キャラクター/man/体勉体_マギグラビ.png" },
    { path: "STAMINA_STUDY_LIFE",      name: "クロック",     img: "キャラクター/man/体勉生_クロック.png" },
    { path: "STAMINA_STAMINA_STUDY",   name: "ガイア",       img: "キャラクター/man/体体勉_ガイア.png" },
    { path: "STAMINA_STAMINA_STAMINA", name: "ゴッドストーン", img: "キャラクター/man/体体体_ゴッドストーン.png" },
    { path: "STAMINA_STAMINA_LIFE",    name: "ガーディアン", img: "キャラクター/man/体体生_ガーディアン.png" },
    { path: "STAMINA_LIFE_STUDY",      name: "エール",       img: "キャラクター/man/体生勉_エール.png" },
    { path: "STAMINA_LIFE_STAMINA",    name: "グロウ",       img: "キャラクター/man/体生体_グロウ.png" },
    { path: "STAMINA_LIFE_LIFE",       name: "ミコシ",       img: "キャラクター/man/体生生_ミコシ.png" },
    { path: "LIFE_STUDY_STUDY",        name: "カレンダー",   img: "キャラクター/man/生勉勉_カレンダー.png" },
    { path: "LIFE_STUDY_STAMINA",      name: "マイスター",   img: "キャラクター/man/生勉体_マイスター.png" },
    { path: "LIFE_STUDY_LIFE",         name: "カロリー",     img: "キャラクター/man/生勉生_カロリー.png" },
    { path: "LIFE_STAMINA_STUDY",      name: "マーチャント", img: "キャラクター/man/生体勉_マーチャント.png" },
    { path: "LIFE_STAMINA_STAMINA",    name: "ムービング",   img: "キャラクター/man/生体体_ムービング.png" },
    { path: "LIFE_STAMINA_LIFE",       name: "ナース",       img: "キャラクター/man/生体生_ナース.png" },
    { path: "LIFE_LIFE_STUDY",         name: "シェフ",       img: "キャラクター/man/生生勉_シェフ.png" },
    { path: "LIFE_LIFE_STAMINA",       name: "サンシャイン", img: "キャラクター/man/生生体_サンシャイン.png" },
    { path: "LIFE_LIFE_LIFE",          name: "ゴッドセバス", img: "キャラクター/man/生生生_ゴッドセバス.png" },
  ],
};

// ステージごとのXP閾値
const THRESHOLDS = { 1: 10, 2: 30, 3: null }; // null = 最終形態（転生閾値70pt）
const REBIRTH_THRESHOLD = 70;

// ダミーのこども名
const CHILD_NAMES = ["たろう", "はなこ", "けんた", "みく", "ゆうと"];
const child_name = CHILD_NAMES[Math.floor(Math.random() * CHILD_NAMES.length)];

// パスセグメント → カテゴリ配列
function pathToSegments(path) {
  return path.split("_");
}

// 確率的重みを計算（dominant 60%キャップ）
function computeWeights(pts) {
  const total = pts.STUDY + pts.STAMINA + pts.LIFE;
  if (total === 0) return { STUDY: 1/3, STAMINA: 1/3, LIFE: 1/3 };
  const entries = [["STUDY", pts.STUDY], ["STAMINA", pts.STAMINA], ["LIFE", pts.LIFE]];
  entries.sort((a, b) => b[1] - a[1]);
  const [first, second, third] = entries;
  const fp = Math.min(first[1] / total, 0.6);
  const rem = 1 - fp;
  const st = second[1] + third[1];
  const sp = st === 0 ? rem/2 : rem * (second[1] / st);
  const tp = st === 0 ? rem/2 : rem * (third[1] / st);
  const w = { STUDY: 0, STAMINA: 0, LIFE: 0 };
  w[first[0]] = fp; w[second[0]] = sp; w[third[0]] = tp;
  return w;
}

// パスから dominant カテゴリを推定してptを生成
function fakePts(path, stage) {
  const segs = pathToSegments(path);
  const counts = { STUDY: 0, STAMINA: 0, LIFE: 0 };
  segs.forEach(s => counts[s]++);
  const thresh = stage === 1 ? 10 : stage === 2 ? 30 : 70;
  // dominant カテゴリに多めに振る
  const total = 3 + Math.floor(Math.random() * (thresh - 4));
  const domKey = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  let study=0, stamina=0, life=0;
  const dom = Math.floor(total * (0.4 + Math.random()*0.3));
  const rest = total - dom;
  const other = rest > 0 ? Math.floor(rest * 0.6) : 0;
  const last = rest - other;
  if (domKey === "STUDY")   { study=dom; stamina=other; life=last; }
  else if (domKey === "STAMINA") { stamina=dom; study=other; life=last; }
  else { life=dom; study=other; stamina=last; }
  return { STUDY: study, STAMINA: stamina, LIFE: life };
}

function pathEmoji(path) {
  return pathToSegments(path).map((s,i) => (i===0?"":' → ') + CAT[s].emoji).join('');
}

function renderPhone(stage, monster) {
  const thresh = THRESHOLDS[stage];
  const pts = fakePts(monster.path, stage);
  const total = pts.STUDY + pts.STAMINA + pts.LIFE;
  const pendingStudy = Math.floor(Math.random() * 3);
  const pendingTotal = pendingStudy;
  const weights = computeWeights(pts);
  const streak = 3 + Math.floor(Math.random() * 25);
  const monthly = 8 + Math.floor(Math.random() * 15);

  const xpPct = thresh !== null ? Math.min(100, (total / thresh) * 100) : Math.min(100, (total / REBIRTH_THRESHOLD) * 100);
  const pendPct = thresh !== null ? Math.min(100 - xpPct, (pendingTotal / thresh) * 100) : 0;

  const xpLabel = thresh !== null
    ? `${total} / ${thresh} pt${pendingTotal > 0 ? ` + ${pendingTotal} pt(仮)` : ''}`
    : `${total} / ${REBIRTH_THRESHOLD} pt`;
  const xpRight = thresh !== null ? "進化まで" : "転生まで";

  const segs = pathToSegments(monster.path);

  // ストリーク称号
  let streakTitle = "";
  if (streak >= 7) streakTitle = `<div class="streak-title"><span>⚔️</span><span>一週間の戦士</span></div>`;
  else if (streak >= 3) streakTitle = `<div class="streak-title"><span>🔥</span><span>はじめの一歩</span></div>`;

  const paramRows = ["STUDY","STAMINA","LIFE"].map(key => {
    const c = CAT[key];
    const val = pts[key];
    const pct = thresh !== null ? Math.min(100, Math.round((val / thresh) * 100)) : Math.min(100, Math.round((val / REBIRTH_THRESHOLD) * 100));
    const pendPctP = key === "STUDY" ? Math.min(100-pct, thresh !== null ? Math.round((pendingStudy/thresh)*100) : 0) : 0;
    return `
      <div class="param-card">
        <div class="param-stripe" style="background:${c.color}"></div>
        <div class="param-top">
          <div class="param-icon" style="background:${c.color}18">${c.emoji}</div>
          <div class="param-name">${c.name}</div>
          <div class="param-pts" style="color:${c.color}">${val} <span class="unit">pt</span>${key==="STUDY"&&pendingStudy>0?`<span style="font-size:10px;color:#9a8c6e;margin-left:4px">+${pendingStudy} (仮)</span>`:""}</div>
        </div>
        <div class="param-bar-wrap">
          <div class="param-bar" style="width:${pct}%;background:linear-gradient(90deg,${c.color}70,${c.color})"></div>
          ${pendPctP>0?`<div style="height:100%;width:${pendPctP}%;background:${c.color}30;border-left:1px dashed ${c.color}70"></div>`:""}
        </div>
      </div>`;
  }).join('');

  const evoHint = thresh !== null ? `
    <div class="evo-hint">
      <div class="evo-hint-title">次の進化 · あと ${Math.max(0, thresh - total)} pt</div>
      <div class="evo-cols">
        ${["STUDY","STAMINA","LIFE"].map(k => `
          <div class="evo-col">
            <div class="cat" style="color:${CAT[k].color}">${CAT[k].emoji} ${CAT[k].name}</div>
            <div class="pct">${Math.round(weights[k]*100)}%</div>
          </div>`).join('')}
      </div>
    </div>` : `<div class="rebirth-hint">💫 最終形態 · あと ${Math.max(0, REBIRTH_THRESHOLD - total)} pt で転生</div>`;

  return `
    <div class="hero">
      <div class="monster-img-wrap">
        <img src="${monster.img}" alt="${monster.name}" onerror="this.style.fontSize='60px';this.textContent='🥚'">
      </div>
      <p class="child-name">${child_name}</p>
      <p class="monster-name">${monster.name}</p>
      <p class="path-emojis">${pathEmoji(monster.path)}</p>
      <div class="xp-label"><span>${xpLabel}</span><span>${xpRight}</span></div>
      <div class="xp-bar-wrap">
        <div class="xp-bar" style="width:${xpPct}%"></div>
        ${pendPct>0?`<div class="xp-bar-pending" style="width:${pendPct}%"></div>`:""}
      </div>
      ${thresh===null?'<p class="final-badge">🌟 最終形態</p>':""}
    </div>

    <div class="card streak">
      ${streakTitle}
      <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:10px">
        <span class="streak-num">${streak}</span><span class="streak-unit">日連続</span>
      </div>
      <div class="streak-stats">
        <div><span class="label">今月</span><span class="val">${monthly}日</span></div>
        <div><span class="label">最高</span><span class="val">${streak}日</span></div>
      </div>
      ${streak < 7 ? `<div class="streak-next"><span>⚔️</span><span>あと${7-streak}日で「一週間の戦士」</span></div>` : ""}
    </div>

    <div class="card">
      <div class="total-row">
        <span class="total-label">合計ポイント</span>
        <span class="total-val">${total} pt</span>
      </div>
    </div>

    ${paramRows}
    ${evoHint}

    <div class="bottom-nav">
      <div class="nav-item"><span class="icon">⚔️</span><span>クエスト</span></div>
      <div class="nav-item active"><span class="icon">🥚</span><span>モンスター</span></div>
      <div class="nav-item"><span class="icon">📖</span><span>図鑑</span></div>
    </div>
  `;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function reroll(stage) {
  const monster = pick(MONSTERS[stage]);
  document.getElementById(`phone-${stage}`).innerHTML = renderPhone(stage, monster);
}

// 初期描画
reroll(1);
reroll(2);
reroll(3);
</script>
