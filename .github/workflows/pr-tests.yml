name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Report coverage on PR
        # Skip when the workflow runs with a read-only GITHUB_TOKEN — the action
        # would 403 and fail the job. Two cases:
        #   1. PR from a fork (head repo != this repo)
        #   2. Dependabot-triggered PRs (branch is same-repo, but GitHub still
        #      downgrades the token to read-only unless explicitly enabled)
        if: always()
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: davelosert/vitest-coverage-report-action@v2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Stage 2: blocking gate. Pre-existing lint debt (see #19-#23) has been
    # paid down to 0 errors / 0 warnings (see #70), so lint failures now
    # block the PR (tracked in #24).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0
