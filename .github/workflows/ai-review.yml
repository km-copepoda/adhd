name: OpenAI Auto Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          # main との差分を取得（文字数制限対策で先頭300行に制限）
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "DIFF_EXISTS=$(test -s pr_diff.txt && echo true || echo false)" >> $GITHUB_ENV

      - name: Run OpenAI Review & Post Comment
        if: env.DIFF_EXISTS == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # diffをJSONエスケープ処理
          DIFF_CONTENT=$(cat pr_diff.txt | jq -sR .)

          PROMPT="あなたは厳格なコードレビュアーです。以下のPR差分(diff)をレビューしてください。\nバグ、セキュリティ問題、パフォーマンス悪化があれば該当箇所を指摘してください。問題がなければその旨をコメントしてください。\n\n--- diff ---\n$DIFF_CONTENT"

          # OpenAI API (gpt-4o) を呼び出し
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o\",
              \"messages\": [{\"role\": \"user\", \"content\": $DIFF_CONTENT}]
            }")

          # AIからの回答内容を抽出
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ "$REVIEW_TEXT" != "null" ] && [ -n "$REVIEW_TEXT" ]; then
            # PRにコメント投稿
            gh pr comment "$PR_URL" --body "### 🤖 OpenAI Code Review Result

          $REVIEW_TEXT"
          else
            echo "API Call failed:"
            echo "$RESPONSE"
            exit 1
          fi